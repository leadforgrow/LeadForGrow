<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form Submission - LeadForGrow</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #0f172a;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 32px;
            font-size: 15px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #0f172a;
            /* Black text */
            background: #f8fafc;
        }

        input:hover,
        textarea:hover {
            border-color: #cbd5e1;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 24px;
            font-weight: 500;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .message.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .token-input {
            background: #fffbeb;
            border-color: #fcd34d;
            color: #92400e;
        }

        .help-text {
            font-size: 12px;
            color: #64748b;
            margin-top: 6px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Test Form Submission</h1>
        <p class="subtitle">Submit a test lead to your LeadForGrow form</p>

        <div id="message" class="message"></div>

        <form id="testForm">
            <div class="form-group">
                <label for="token">Form Token *</label>
                <input type="text" id="token" name="token" class="token-input" placeholder="lfg_form_..." required>
                <p class="help-text">Get this from your form's embed code in the Forms page</p>
            </div>

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" placeholder="+1234567890" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="serviceInterest">Service Interest</label>
                <input type="text" id="serviceInterest" name="serviceInterest" placeholder="Web Development">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="I'm interested in your services..."></textarea>
            </div>

            <button type="submit" id="submitBtn">
                Submit Test Lead
            </button>
        </form>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');

        // Check for token in URL
        const urlParams = new URLSearchParams(window.location.search);
        const tokenParam = urlParams.get('token');
        if (tokenParam) {
            const tokenInput = document.getElementById('token');
            tokenInput.value = tokenParam;
            tokenInput.closest('.form-group').style.display = 'none'; // Hide token field
            document.querySelector('h1').textContent = 'Contact Us'; // User-friendly title
            document.querySelector('.subtitle').style.display = 'none'; // Hide test subtitle
            document.title = 'Contact Us';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            messageDiv.style.display = 'none';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/forms/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.textContent = '✅ ' + (result.message || 'Thank you! We will contact you soon.');
                    form.reset();

                    // If hidden token existed, restore it
                    if (tokenParam) {
                        document.getElementById('token').value = tokenParam;
                    }

                    // If there's a redirect URL, show it
                    if (result.redirectUrl) {
                        setTimeout(() => {
                            window.location.href = result.redirectUrl;
                        }, 2000);
                    }
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = '❌ ' + (result.error || 'Submission failed');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Network error: ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = tokenParam ? 'Submit Inquiry' : 'Submit Test Lead';
            }
        });
    </script>
</body>

</html>
