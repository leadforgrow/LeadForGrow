<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LFG Chatbot Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      padding: 40px;
      color: #1e293b;
      height: 200vh;
      /* Add height to test scrolling */
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 20px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      margin-top: 0;
      color: #0f172a;
    }

    code {
      background: #f1f5f9;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .debug-tip {
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>🚀 Chatbot Integration Test</h1>
    <p>This page is testing the LeadForGrow Chatbot widget.</p>
    <p>Current Business ID: <code>6981cffb3eeaed715dcc8893</code></p>
    <p>The chatbot should appear in the <strong>bottom-right</strong> corner.</p>
    <div class="debug-tip">
      <strong>Debugging:</strong> Check the browser console (F12) for logs starting with <code>[LFG Chat]</code>.
    </div>
  </div>

  <!-- START LFG CHATBOT -->
  <script>
    window.LFG_CHAT_CONFIG = {
      businessId: "6981cffb3eeaed715dcc8893",
      position: "right"
    };
  </script>
  <script src="http://localhost:3000/chat-widget.js" async></script>
  <!-- END LFG CHATBOT -->

</html>
